name: monitor

on:
  schedule:
    - cron: "*/5 * * * *"    # 目标约 5 分钟一查；实际触发时间受 GitHub 调度影响可能有延迟
  workflow_dispatch:          # 支持手动触发（首次上线/排障用）
    inputs:
      mode:
        description: "normal=常规检查 / test-email=健康检查+测试邮件"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - test-email

permissions:
  contents: write             # 用于回写 monitor_state.json

concurrency:
  group: monitor
  cancel-in-progress: false   # 不并行、不取消，顺序执行防竞态

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests (mock, 不联网)
        run: python -m pytest tests/ -q

      - name: Run monitor
        if: ${{ github.event.inputs.mode != 'test-email' }}
        env:
          IG_COOKIE: ${{ secrets.IG_COOKIE }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_TITLE_PREFIX: ${{ secrets.NOTIFY_TITLE_PREFIX }}
          IG_POST_SESSION_JSON: ${{ secrets.IG_POST_SESSION_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # Data API v3 备用通道（未配则自动跳过）
        run: python -m monitor.main

      - name: Health check + test email
        if: ${{ github.event.inputs.mode == 'test-email' }}
        env:
          IG_COOKIE: ${{ secrets.IG_COOKIE }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_TITLE_PREFIX: ${{ secrets.NOTIFY_TITLE_PREFIX }}
          IG_POST_SESSION_JSON: ${{ secrets.IG_POST_SESSION_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m monitor.main --test-email

      - name: Commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor_state.json
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          # push 竞态重试：本轮 checkout 后远端又前进（部署推送/其他 state 提交）
          # 时会被拒。fetch+rebase 后重试最多 3 次；若 rebase 在 monitor_state.json
          # 上冲突（说明远端已有更新的 state），放弃本地这份——下轮从实时数据重写。
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "state pushed (attempt $i)"
              exit 0
            fi
            echo "push rejected (attempt $i) — fetch+rebase 后重试"
            git fetch origin main || true
            git rebase origin/main || {
              git rebase --abort
              echo "rebase 冲突：远端已有更新 state，放弃本轮回写（下轮自动补上，不影响监测）"
              exit 0
            }
            sleep $((RANDOM % 8 + 4))
          done
          echo "push 3 次均被拒"
          exit 1

      - name: Daily heartbeat
        run: |
          AGE=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ $AGE -gt 86400 ]; then
            date -u +"last active: %Y-%m-%dT%H:%M:%SZ" > .heartbeat
            git add .heartbeat
            git commit -m "heartbeat [skip ci]"
            git push
          else
            echo "last commit ${AGE}s ago — no heartbeat needed"
          fi
