name: monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # 目标约 5 分钟一查；实际触发时间受 GitHub 调度影响可能有延迟
  workflow_dispatch:          # 支持手动触发（首次上线/排障用）

permissions:
  contents: write             # 用于回写 monitor_state.json

concurrency:
  group: monitor
  cancel-in-progress: false   # 不并行、不取消，顺序执行防竞态

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests (mock, 不联网)
        run: python -m pytest tests/ -q

      - name: Run monitor
        env:
          IG_COOKIE: ${{ secrets.IG_COOKIE }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python -m monitor.main

      - name: Commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor_state.json
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git push)

      - name: Daily heartbeat
        run: |
          AGE=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ $AGE -gt 86400 ]; then
            date -u +"last active: %Y-%m-%dT%H:%M:%SZ" > .heartbeat
            git add .heartbeat
            git commit -m "heartbeat [skip ci]"
            git push
          else
            echo "last commit ${AGE}s ago — no heartbeat needed"
          fi
